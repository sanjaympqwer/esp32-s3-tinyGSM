<!DOCTYPE html>
<html>
  <head>
    <title>ESP32 TTS Control (Option A)</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f8f8f8;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        padding-top: 40px;
      }
      h2 { color: #333; }
      input, select {
        width: 320px;
        font-size: 1rem;
        padding: 8px;
        margin: 5px 0;
        border-radius: 6px;
        border: 1px solid #ccc;
      }
      button {
        font-size: 1.1rem;
        padding: 10px 20px;
        margin-top: 10px;
        border: none;
        border-radius: 8px;
        background: #0078ff;
        color: white;
        cursor: pointer;
      }
      button:hover { background: #005fd1; }
      #log {
        width: 360px;
        height: 220px;
        margin-top: 20px;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 10px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <h2>ESP32-S3 TTS Control (Device ID Routing)</h2>

    <label>Target Device ID:</label>
    <input id="deviceId" placeholder="e.g. DEVICE_1234" />

    <label>Text to speak:</label>
    <input id="msg" placeholder="Type text to speak" />

    <button onclick="sendSpeak()">Send to Device</button>

    <div id="log"></div>

    <script>
      const ws = new WebSocket("wss://" + location.host);
      const log = document.getElementById("log");

      function logLine(t) {
        log.innerHTML += t + "<br>";
        log.scrollTop = log.scrollHeight;
      }

      ws.onopen = () => logLine("✅ Connected to server");
      ws.onclose = () => logLine("❌ Disconnected");
      ws.onerror = (e) => logLine("⚠ WebSocket error");
      ws.onmessage = (e) => logLine("📩 " + e.data);

      function sendSpeak() {
        const deviceId = document.getElementById("deviceId").value.trim();
        const text = document.getElementById("msg").value.trim();
        if (!deviceId) {
          alert("Enter deviceId (like DEVICE_1234)");
          return;
        }
        if (!text) return;

        const payload = {
          type: "speak",
          deviceId,
          text,
        };

        ws.send(JSON.stringify(payload));
        logLine("➡ Sent to " + deviceId + ": " + text);
        document.getElementById("msg").value = "";
      }
    </script>
  </body>
</html>
